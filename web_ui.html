<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube Downloader</title>
<style>
:root{
  --bg:#0f1419;--bg2:#1a2029;--bg3:#242c38;--text:#e6e6e6;--dim:#8b95a5;
  --accent:#4a90e2;--accent-hover:#357abd;--ok:#4caf50;--err:#f44336;
  --warn:#ff9800;--border:#2d3744;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
     background:var(--bg);color:var(--text);padding:20px;line-height:1.5}
.container{max-width:1050px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
        flex-wrap:wrap;margin-bottom:24px}
h1{color:#fff;margin:0 0 6px}
.subtitle{color:var(--dim);margin:0}
.lang-box{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px}
.lang-box select{background:var(--bg3);border:1px solid var(--border);border-radius:6px;
  color:var(--text);padding:6px 8px;font-size:13px;font-family:inherit}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;
      padding:20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.card h3{margin-top:0;color:#fff}
label{display:block;margin-bottom:6px;color:var(--dim);font-size:13px}
input[type=text],select{width:100%;padding:10px 12px;background:var(--bg3);
  border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;
  font-family:inherit}
input[type=text]:focus,select:focus{outline:none;border-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.row-3{grid-template-columns:1.2fr 1fr 1fr}
button{padding:10px 20px;background:var(--accent);color:#fff;border:none;
       border-radius:6px;cursor:pointer;font-size:14px;font-weight:500;
       transition:background .2s;display:inline-flex;align-items:center;gap:6px}
button:hover:not(:disabled){background:var(--accent-hover)}
button:disabled{opacity:.5;cursor:not-allowed}
button.secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
button.secondary:hover:not(:disabled){background:var(--border)}
.actions{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.info-wrap{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}
.info-wrap img{width:100%;border-radius:8px;background:var(--bg3)}
.info-title{font-size:17px;margin-bottom:10px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-item{background:var(--bg3);padding:8px 12px;border-radius:6px}
.info-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.info-value{font-size:14px;word-break:break-word}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500}
.badge.ok{background:#1b3d1f;color:#6bcf76}
.badge.warn{background:#4a3b1f;color:#f0c674}
.badge.err{background:#4a1f1f;color:#f08080}
.progress-bar{width:100%;height:8px;background:var(--bg3);border-radius:4px;
              overflow:hidden;margin:14px 0}
.progress-fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.progress-fill.err{background:var(--err)}
.progress-fill.ok{background:var(--ok)}
.log-console{background:#0a0e12;border:1px solid var(--border);border-radius:6px;
  padding:12px;font-family:"Consolas","Monaco",monospace;font-size:12px;
  max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;
  color:#b8c5d6}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--dim);font-weight:500;font-size:12px;text-transform:uppercase;
   letter-spacing:.4px}
tr:hover{background:var(--bg3)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.hidden{display:none}
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{color:var(--dim);font-style:italic;padding:8px 0}
@media(max-width:700px){
  .row,.row-3,.info-grid,.info-wrap{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1 data-i18n="web_app_title">🎬 YouTube Downloader</h1>
      <p class="subtitle" data-i18n="web_subtitle">Видео, аудио и транскрипции — прямо из браузера</p>
    </div>
    <div class="lang-box">
      <span id="langLabel">🌐 Язык</span>
      <select id="langSelect">
        <option value="en">English</option>
        <option value="ru">Русский</option>
        <option value="uk">Українська</option>
        <option value="pt">Português</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
      </select>
    </div>
  </div>

  <div class="card">
    <label for="url" data-i18n="web_url_label">Ссылка на видео</label>
    <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=...">

    <div class="row row-3">
      <div>
        <label for="quality" data-i18n="web_quality_label">Качество</label>
        <select id="quality">
          <option value="max" data-i18n="web_q_max">Максимальное (1080p+ DASH)</option>
          <option value="medium" data-i18n="web_q_medium">Среднее</option>
          <option value="low" data-i18n="web_q_low">Низкое</option>
          <option value="audio" data-i18n="web_q_audio">Только аудио (mp3)</option>
        </select>
      </div>
      <div>
        <label for="lang" data-i18n="web_lang_audio">Язык аудио / транскрипции</label>
        <input id="lang" type="text" value="ru">
      </div>
      <div>
        <label for="saveMp3" data-i18n="web_extra_label">Дополнительно</label>
        <label style="display:flex;align-items:center;color:var(--text);cursor:pointer">
          <input type="checkbox" id="saveMp3" style="margin-right:8px">
          <span data-i18n="web_save_mp3">Сохранить mp3 рядом с mp4</span>
        </label>
      </div>
    </div>

    <div class="actions">
      <button id="btnInfo" class="secondary" data-i18n="web_btn_info">🔍 Получить информацию</button>
      <button id="btnDownload" data-i18n="web_btn_download">⬇️ Скачать</button>
    </div>
  </div>

  <div id="infoCard" class="card hidden">
    <h3 data-i18n="web_info_title">Информация о видео</h3>
    <div class="info-wrap">
      <img id="thumbnail" alt="">
      <div>
        <div class="info-title" id="infoTitle"></div>
        <div class="info-grid">
          <div class="info-item"><div class="info-label" data-i18n="web_author">Автор</div>
            <div class="info-value" id="infoAuthor">—</div></div>
          <div class="info-item"><div class="info-label" data-i18n="web_duration">Длительность</div>
            <div class="info-value" id="infoDuration">—</div></div>
          <div class="info-item"><div class="info-label" data-i18n="web_id">ID</div>
            <div class="info-value" id="infoId">—</div></div>
          <div class="info-item"><div class="info-label" data-i18n="web_status">Статус</div>
            <div class="info-value" id="infoStatus">—</div></div>
          <div class="info-item" style="grid-column:1/-1">
            <div class="info-label" data-i18n="web_resolutions">Доступные разрешения</div>
            <div class="info-value" id="infoRes">—</div></div>
        </div>
      </div>
    </div>
  </div>

  <div id="progressCard" class="card hidden">
    <h3 data-i18n="web_progress_title">Прогресс скачивания</h3>
    <div style="display:flex;justify-content:space-between;color:var(--dim);font-size:13px">
      <span id="progressStage">—</span>
      <span id="progressPercent">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="log-console" id="logConsole"></div>
  </div>

  <div class="card">
    <h3 data-i18n="web_files_title">📁 Скачанные файлы</h3>
    <div id="filesList"><div class="empty">…</div></div>
  </div>

  <div class="card">
    <h3 data-i18n="web_log_title">📊 Журнал загрузок</h3>
    <div id="logTable"><div class="empty">…</div></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let currentTaskId = null;
let pollTimer = null;

// ====== i18n ======
const LANGS = ["en", "ru", "uk", "pt", "de", "fr"];
let I18N = {};
let LANG = "en";

const tr = key =>
  (I18N[LANG] && I18N[LANG][key]) || (I18N.en && I18N.en[key]) || key;

function detectLang() {
  const saved = localStorage.getItem("ytd_lang");
  if (saved && LANGS.includes(saved)) return saved;
  const nav = (navigator.language || "en").toLowerCase().split("-")[0];
  return LANGS.includes(nav) ? nav : "en";
}

function applyI18n() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    const text = tr(key);
    if (text !== key) el.textContent = text;
  });
  const url = $("url");
  const ph = tr("web_url_placeholder");
  if (ph !== "web_url_placeholder") url.placeholder = ph;
  const ll = $("langLabel");
  const llt = tr("web_lang");
  if (llt !== "web_lang") ll.textContent = llt;
  $("langSelect").value = LANG;
  loadFiles(); loadLog();
}

async function initI18n() {
  LANG = detectLang();
  try {
    const r = await fetch("/api/i18n");
    I18N = await r.json();
  } catch (e) { /* сервер без переводов — останутся исходные тексты */ }
  applyI18n();
}

$("langSelect").addEventListener("change", e => {
  LANG = e.target.value;
  localStorage.setItem("ytd_lang", LANG);
  applyI18n();
});

const escapeHtml = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ====== Информация о видео ======
async function fetchInfo() {
  const url = $("url").value.trim();
  if (!url) { alert(tr("web_err_no_url")); return; }

  const btn = $("btnInfo");
  btn.disabled = true;
  const old = tr("web_btn_info");
  const loading = tr("web_btn_loading");
  btn.innerHTML = loading !== "web_btn_loading" ? loading : old;

  try {
    const r = await fetch("/api/info", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || tr("web_err_server"));

    $("thumbnail").src = d.thumbnail;
    $("infoTitle").textContent = d.title;
    $("infoAuthor").textContent = d.author;
    $("infoDuration").textContent = d.duration;
    $("infoId").textContent = d.id;

    const st = $("infoStatus");
    st.innerHTML = d.already_downloaded
      ? '<span class="badge warn">' + escapeHtml(tr("web_badge_downloaded")) + '</span>'
      : '<span class="badge ok">' + escapeHtml(tr("web_badge_new")) + '</span>';

    const resList = d.resolutions?.length
      ? d.resolutions.join(", ")
      : (d.progressive_resolutions?.join(", ") || "—");
    $("infoRes").textContent = resList
      + (d.has_captions ? tr("web_captions_yes") : tr("web_captions_no"));

    $("infoCard").classList.remove("hidden");
  } catch (e) {
    alert(tr("web_err_prefix") + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = tr("web_btn_info");
  }
}

// ====== Запуск скачивания ======
async function startDownload() {
  const url = $("url").value.trim();
  if (!url) { alert(tr("web_err_no_url")); return; }

  const payload = {
    url,
    quality: $("quality").value,
    lang: $("lang").value.trim() || "ru",
    save_mp3: $("saveMp3").checked,
    ui_lang: LANG
  };

  $("btnDownload").disabled = true;
  $("progressCard").classList.remove("hidden");
  $("logConsole").textContent = "";
  $("progressFill").className = "progress-fill";
  $("progressFill").style.width = "0%";
  $("progressPercent").textContent = "0%";
  $("progressStage").textContent = tr("web_launching");

  try {
    const r = await fetch("/api/download", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || tr("web_err_server"));

    currentTaskId = d.task_id;
    startPolling();
  } catch (e) {
    appendLog("❌ " + e.message);
    $("btnDownload").disabled = false;
  }
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(checkStatus, 800);
  checkStatus();
}

async function checkStatus() {
  if (!currentTaskId) return;
  try {
    const r = await fetch("/api/status/" + currentTaskId);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || tr("web_err_server"));

    if (typeof d.log === "string" && d.log !== $("logConsole").textContent) {
      $("logConsole").textContent = d.log;
      $("logConsole").scrollTop = $("logConsole").scrollHeight;
    }
    if (typeof d.percent === "number") {
      $("progressFill").style.width = d.percent + "%";
      $("progressPercent").textContent = d.percent + "%";
    }
    if (d.message) $("progressStage").textContent = d.message;

    if (d.status === "done") {
      clearInterval(pollTimer); pollTimer = null;
      $("progressFill").classList.add("ok");
      $("progressFill").style.width = "100%";
      $("progressPercent").textContent = "100%";
      $("progressStage").textContent = tr("web_done");
      $("btnDownload").disabled = false;
      loadFiles(); loadLog();
    } else if (d.status === "error") {
      clearInterval(pollTimer); pollTimer = null;
      $("progressFill").classList.add("err");
      $("progressStage").textContent = tr("web_error_prefix") + (d.message || "");
      $("btnDownload").disabled = false;
      loadFiles(); loadLog();
    }
  } catch (e) {
    appendLog("⚠️ " + e.message);
  }
}

function appendLog(txt) {
  const c = $("logConsole");
  c.textContent += "\n" + txt;
  c.scrollTop = c.scrollHeight;
}

// ====== Список файлов ======
async function loadFiles() {
  try {
    const r = await fetch("/api/files");
    const files = await r.json();
    if (!files.length) {
      $("filesList").innerHTML = '<div class="empty">' + escapeHtml(tr("web_empty_files")) + '</div>';
      return;
    }
    let h = "<table><thead><tr><th>" + escapeHtml(tr("web_col_file")) + "</th><th>" +
            escapeHtml(tr("web_col_size")) + "</th><th></th></tr></thead><tbody>";
    for (const f of files) {
      const mb = (f.size / (1024 * 1024)).toFixed(2);
      const enc = encodeURIComponent(f.name);
      h += `<tr><td>${escapeHtml(f.name)}</td><td>${mb} MB</td>
            <td><a href="/api/files/${enc}" download>${escapeHtml(tr("web_download_link"))}</a></td></tr>`;
    }
    h += "</tbody></table>";
    $("filesList").innerHTML = h;
  } catch (e) {
    $("filesList").innerHTML = '<div class="empty">' +
      escapeHtml(tr("web_err_prefix") + e.message) + '</div>';
  }
}

// ====== Журнал ======
async function loadLog() {
  try {
    const r = await fetch("/api/log");
    const entries = await r.json();
    if (!entries.length) {
      $("logTable").innerHTML = '<div class="empty">' + escapeHtml(tr("web_empty_log")) + '</div>';
      return;
    }
    let h = "<table><thead><tr><th>" + escapeHtml(tr("web_col_date")) + "</th><th>" +
            escapeHtml(tr("web_col_type")) + "</th><th>" + escapeHtml(tr("web_col_title")) + "</th><th>" +
            escapeHtml(tr("web_col_author")) + "</th><th>" + escapeHtml(tr("web_col_quality")) + "</th><th>" +
            escapeHtml(tr("web_col_size")) + "</th><th>" + escapeHtml(tr("web_col_audio_file")) +
            "</th></tr></thead><tbody>";
    for (const e of entries) {
      h += `<tr>
        <td>${escapeHtml(e.date)}</td>
        <td>${escapeHtml(e.type)}</td>
        <td><a href="https://youtu.be/${escapeHtml(e.id)}" target="_blank"
              rel="noopener">${escapeHtml(e.title)}</a></td>
        <td>${escapeHtml(e.author)}</td>
        <td>${escapeHtml(e.quality)}</td>
        <td>${escapeHtml(e.size)}</td>
        <td>${escapeHtml(e.audio_file)}</td>
      </tr>`;
    }
    h += "</tbody></table>";
    $("logTable").innerHTML = h;
  } catch (e) {
    $("logTable").innerHTML = '<div class="empty">' +
      escapeHtml(tr("web_err_prefix") + e.message) + '</div>';
  }
}

// ====== События ======
$("btnInfo").addEventListener("click", fetchInfo);
$("btnDownload").addEventListener("click", startDownload);
$("url").addEventListener("keydown", e => {
  if (e.key === "Enter") fetchInfo();
});

// Автообновление
initI18n();
setInterval(() => { loadFiles(); loadLog(); }, 10000);
</script>
</body>
</html>
