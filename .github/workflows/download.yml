name: Download YouTube video

# Ручной запуск: вкладка Actions -> Download YouTube video -> Run workflow
# В репозитории ничего не сохраняется: отдаётся только сам медиафайл
# (mp4/mp3) в виде артефакта, живущего 1 день.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Ссылка на YouTube-видео"
        required: true
      quality:
        description: "Качество"
        type: choice
        default: "max"
        options:
          - max
          - medium
          - low
          - audio
      lang:
        description: "Язык аудио/транскрипции"
        default: "ru"
      ui_lang:
        description: "Interface language"
        type: choice
        default: "en"
        options: [en, ru, uk, pt, de, fr]
      save_mp3:
        description: "Дополнительно сохранить mp3 рядом с mp4"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ffmpeg -version | head -n 1

      - name: Run downloader
        env:
          YDL_URL: ${{ inputs.url }}
          YDL_QUALITY: ${{ inputs.quality }}
          YDL_LANG: ${{ inputs.lang }}
          YDL_UI_LANG: ${{ inputs.ui_lang }}
          YDL_MP3: ${{ inputs.save_mp3 }}
        run: |
          ARGS=("$YDL_URL" "$YDL_QUALITY" --lang "$YDL_LANG" --ui-lang "$YDL_UI_LANG" -o downloads)
          if [ "$YDL_MP3" = "true" ]; then ARGS+=(--mp3); fi
          python download.py "${ARGS[@]}"

      # В артефакт попадают только медиафайлы: транскрипция, журнал и
      # временные файлы _tmp_* остаются на раннере и удаляются с ним.
      - name: Upload media files
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: youtube-download
          path: |
            downloads/*.mp4
            downloads/*.mp3
            downloads/*.m4a
          retention-days: 1
          if-no-files-found: warn

      - name: Explain failure
        if: failure()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ⚠️ Download failed

          The most likely cause: **YouTube blocked the request** — GitHub Actions
          runners use datacenter IPs, and YouTube often answers them with
          `BotDetection` ("Sign in to confirm you're not a bot").

          What helps:
          - run the tool **locally** (see README, section *Usage: CLI / Web UI*);
          - or use **GitHub Codespaces** (also from the browser, residential-grade egress);
          - retrying the same link later sometimes works too.
          EOF
