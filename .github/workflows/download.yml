name: Download YouTube video

# Ручной запуск: вкладка Actions -> Download YouTube video -> Run workflow
# Скачанный файл появляется как artifact в сводке запуска; при publish=true —
# дополнительно прикрепляется к GitHub Release (постоянная страница с файлами).
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Ссылка на YouTube-видео"
        required: true
      quality:
        description: "Качество"
        type: choice
        default: "max"
        options:
          - max
          - medium
          - low
          - audio
      lang:
        description: "Язык аудио/транскрипции"
        default: "ru"
      ui_lang:
        description: "Interface language"
        type: choice
        default: "en"
        options: [en, ru, uk, pt, de, fr]
      save_mp3:
        description: "Дополнительно сохранить mp3 рядом с mp4"
        type: boolean
        default: false
      publish:
        description: "Прикрепить файлы к Release (постоянная страница; иначе только artifact на 1 день)"
        type: boolean
        default: false

permissions:
  contents: write  # нужно только для создания Release; артефакт-путь ничего не пишет

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ffmpeg -version | head -n 1

      - name: Run downloader
        env:
          YDL_URL: ${{ inputs.url }}
          YDL_QUALITY: ${{ inputs.quality }}
          YDL_LANG: ${{ inputs.lang }}
          YDL_UI_LANG: ${{ inputs.ui_lang }}
          YDL_MP3: ${{ inputs.save_mp3 }}
        run: |
          ARGS=("$YDL_URL" "$YDL_QUALITY" --lang "$YDL_LANG" --ui-lang "$YDL_UI_LANG" -o downloads)
          if [ "$YDL_MP3" = "true" ]; then ARGS+=(--mp3); fi
          python download.py "${ARGS[@]}"

      - name: Publish files to a GitHub Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          YDL_URL: ${{ inputs.url }}
          YDL_QUALITY: ${{ inputs.quality }}
        run: |
          TAG="download-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" downloads/* \
            --title "Download $(date -u +%Y-%m-%d %H:%M) UTC" \
            --notes "Source: $YDL_URL | Quality: $YDL_QUALITY"
          echo "RELEASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-download
          path: downloads/
          retention-days: 1
          if-no-files-found: error
